<style>
  .sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
  .flow{stroke-dasharray:4 10;animation:flow 2.4s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-28}}
  .sweep{transform-origin:1010px 178px;animation:spin 6s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .covert{stroke-dasharray:3 6;animation:covert 6s linear infinite, flow 1.2s linear infinite}
  @keyframes covert{0%,70%{opacity:.12}75%{opacity:1}88%{opacity:1}100%{opacity:.12}}
  .flag{opacity:0;animation:flag 6s linear infinite}
  @keyframes flag{0%,72%{opacity:0}75%,90%{opacity:1}100%{opacity:0}}
  .calm{animation:calm 6s linear infinite}
  @keyframes calm{0%,72%{opacity:1}75%,90%{opacity:0}100%{opacity:1}}
  .pulse{transform-origin:86px 74px;animation:pulse 2s ease-out infinite}
  @keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.6);opacity:0}}
  .cursor{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .line{animation:show 12s linear infinite}
  @keyframes show{0%,31%{opacity:1}33.3%,100%{opacity:0}}
  .type0{animation:type0 12s linear infinite}
  @keyframes type0{0%,3%{transform:translateX(0);animation-timing-function:steps(47,end)}17%,100%{transform:translateX(498.2px)}}
  .type1{animation:type1 12s linear infinite}
  @keyframes type1{0%,3%{transform:translateX(0);animation-timing-function:steps(47,end)}17%,100%{transform:translateX(498.2px)}}
  .type2{animation:type2 12s linear infinite}
  @keyframes type2{0%,3%{transform:translateX(0);animation-timing-function:steps(49,end)}17%,100%{transform:translateX(519.4px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
